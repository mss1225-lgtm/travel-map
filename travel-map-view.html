<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>나의 여행 지도</title>
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: a sea-coloured chart fills the left; a logbook column on the right holds the selected country's entry and the full list. Stacks on phones. */
:root{
  --sea:#e6eef2; --paper:#f7fafb; --land:#fdfefe; --line:#9fb3bd;
  --ink:#16252d; --muted:#5b6d76; --rule:#cfdbe1;
  --stamp:#3a3f9e; --stamp-soft:#e3e4f6; --wish:#c98a12; --wish-soft:#f8ecd2; --danger:#b3372f;
  --display:"Gowun Batang","Noto Serif KR",Georgia,serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --sea:#0f181e; --paper:#162129; --land:#2a3740; --line:#51636d;
  --ink:#e8eff2; --muted:#9aacb5; --rule:#2c3a43;
  --stamp:#99a0ff; --stamp-soft:#262a55; --wish:#e6b24c; --wish-soft:#40331a; --danger:#f0857c; color-scheme:dark } }
:root[data-theme="dark"]{
  --sea:#0f181e; --paper:#162129; --land:#2a3740; --line:#51636d;
  --ink:#e8eff2; --muted:#9aacb5; --rule:#2c3a43;
  --stamp:#99a0ff; --stamp-soft:#262a55; --wish:#e6b24c; --wish-soft:#40331a; --danger:#f0857c; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:28px 48px;display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 32px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,4vw,38px);line-height:1.15;margin:0;text-wrap:balance}
.tally{display:flex;gap:24px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.tally div{display:flex;flex-direction:column}
.tally b{font-family:var(--display);font-size:26px;line-height:1.1}
.tally span{font-size:12px;color:var(--muted);letter-spacing:.04em}
.tally .v b{color:var(--stamp)} .tally .w b{color:var(--wish)}

.grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}

.chart{position:relative;background:var(--sea);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
#map{width:100%;touch-action:none;cursor:grab;min-height:180px}
#map svg{display:block}
.datamaps-subunit{fill:var(--land)!important;stroke:var(--line)!important;stroke-width:calc(.6px / var(--k,1))!important;cursor:pointer;transition:fill .15s}
.datamaps-subunit:hover{fill:var(--rule)!important}
.datamaps-subunit.wish{fill:var(--c,var(--wish))!important;fill-opacity:.42}
.datamaps-subunit.visited{fill:var(--c,var(--stamp))!important}
.datamaps-subunit.sel{stroke:var(--ink)!important;stroke-width:calc(1.8px / var(--k,1))!important}
.cn{pointer-events:none;font-family:var(--body);font-weight:600;fill:var(--ink);stroke:var(--paper);paint-order:stroke;stroke-linejoin:round;text-anchor:middle}
.cm{pointer-events:none}
.cm circle{fill:var(--paper);stroke:var(--ink)}
.cm text{font-family:var(--body);font-weight:600;fill:var(--ink);stroke:var(--paper);paint-order:stroke;stroke-linejoin:round}
.pop{position:absolute;z-index:3;width:min(290px,calc(100% - 20px));max-height:calc(100% - 20px);overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:14px;box-shadow:0 6px 24px rgb(0 0 0 / .2);display:flex;flex-direction:column;gap:10px}
.pop .head{padding-right:26px} .pop .head h2{font-size:20px} .pop .flag{font-size:26px}
.pop .x{position:absolute;top:6px;right:6px;width:28px;height:28px;padding:0;border:0;background:none;font-size:20px;line-height:1;color:var(--muted)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:6px}
.ph{position:relative;aspect-ratio:1;border-radius:4px;overflow:hidden;background:var(--sea);padding:0;border:0;cursor:zoom-in}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .rm{position:absolute;top:3px;right:3px;width:22px;height:22px;padding:0;border-radius:99px;background:var(--paper);font-size:14px;line-height:1}
.drop{position:relative;border:1.5px dashed var(--line);border-radius:6px;padding:14px;text-align:center;cursor:pointer;color:var(--muted);font-size:13px;letter-spacing:0}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop:has(input:focus-visible){outline:2px solid var(--stamp);outline-offset:2px}
form.over .drop{border-color:var(--stamp);background:var(--stamp-soft);color:var(--stamp)}
#lb{position:fixed;inset:0;z-index:20;background:rgb(0 0 0 / .86);display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
.log{min-width:0}
.loghead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.loghead h3{margin:0}
.tw{overflow-x:auto;border:1px solid var(--rule);border-radius:6px}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--rule);vertical-align:top}
th{background:var(--sea);padding:0;text-align:left;white-space:nowrap;border-bottom:1px solid var(--rule)}
th button{border:0;background:none;padding:8px 12px;font-size:12px;font-weight:600;width:100%;text-align:left;border-radius:0;color:var(--muted);letter-spacing:.04em}
th[aria-sort] button{color:var(--ink)}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--sea)}
tbody tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
td.note{max-width:300px;color:var(--muted)}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.nmb{border:0;background:none;padding:0;display:flex;gap:8px;align-items:center;font-weight:600;text-align:left;white-space:nowrap}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:32px;height:32px;padding:0;font-size:17px;line-height:1}
.legend{position:absolute;left:12px;right:12px;width:fit-content;bottom:10px;display:flex;flex-wrap:wrap;gap:2px 14px;font-size:12px;color:var(--muted);background:var(--paper);padding:4px 10px;border-radius:4px;border:1px solid var(--rule)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
#tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12px;padding:3px 8px;border-radius:4px;white-space:nowrap;transform:translate(12px,12px)}
.mapfail{padding:28px 20px;color:var(--muted)}

.side{display:flex;flex-direction:column;gap:22px;min-width:0}
.entry{border:1px solid var(--rule);border-radius:6px;padding:18px;background:var(--paper);display:flex;flex-direction:column;gap:14px}
.picker{display:flex;flex-direction:column;gap:4px}
label,.lab{font-size:12px;color:var(--muted);letter-spacing:.04em}
select,input,textarea,button{font:inherit;color:var(--ink)}
select,input[type=text],input[type=month],textarea{width:100%;background:var(--land);border:1px solid var(--line);border-radius:4px;padding:7px 9px;min-width:0}
textarea{min-height:92px;resize:vertical}
button{background:var(--land);border:1px solid var(--line);border-radius:4px;padding:7px 14px;cursor:pointer}
button:hover{border-color:var(--ink)}
button.primary{background:var(--stamp);border-color:var(--stamp);color:var(--paper);font-weight:600}
button.del{color:var(--danger)}
:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}
.head{display:flex;align-items:center;gap:12px}
.flag{font-size:34px;line-height:1}
.head h2{font-family:var(--display);font-size:24px;margin:0;line-height:1.2}
.head small{color:var(--muted);font-size:12px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--stamp-soft);color:var(--stamp)}
.pill.wish{background:var(--wish-soft);color:var(--wish)}
dl{margin:0;display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px 12px}
dt{font-size:12px;color:var(--muted);padding-top:2px}
dd{margin:0;overflow-wrap:anywhere}
.note{white-space:pre-wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{border:1px solid var(--rule);border-radius:4px;padding:0 8px;font-size:13px}
.city{padding:1px 11px;font-size:13px;border-radius:99px}
.city.on{background:var(--stamp-soft);border-color:var(--stamp);color:var(--stamp);font-weight:600}
.stars{color:var(--wish);letter-spacing:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.seg{display:flex;gap:6px}
.seg label{flex:1;text-align:center;border:1px solid var(--line);border-radius:4px;padding:6px;cursor:pointer;font-size:14px;color:var(--ink);letter-spacing:0}
.seg input{position:absolute;opacity:0}
.seg input:checked+span{font-weight:600}
.seg label:has(input:checked){background:var(--stamp-soft);border-color:var(--stamp)}
.seg label:has(input:focus-visible){outline:2px solid var(--stamp);outline-offset:2px}
.hint{color:var(--muted);margin:0}
.msg{font-size:13px;color:var(--danger);margin:0}
.status{font-size:12px;color:var(--muted);margin:0}

.log h3{font-family:var(--display);font-size:18px;margin:0 0 8px}
.log ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.log li button{width:100%;display:flex;align-items:center;gap:10px;text-align:left;border:0;border-bottom:1px solid var(--rule);border-radius:0;background:none;padding:9px 4px}
.log li button:hover{background:var(--sea)}
.log .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.log .when{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:2px;background:var(--stamp);flex:none}
.dot.wish{opacity:.45}
.sw{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.sw button{width:26px;height:26px;padding:0;border-radius:99px;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--line)}
.sw button.auto{width:auto;padding:0 10px;font-size:12px}
.sw button[aria-pressed=true]{box-shadow:0 0 0 2px var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>나의 여행 지도</h1>
    <div class="tally">
      <div class="v"><b id="n-visited">0</b><span>다녀온 나라</span></div>
      <div class="v"><b id="n-city">0</b><span>다녀온 도시</span></div>
      <div><b id="n-pct">0%</b><span>세계 195개국 중</span></div>
      <div class="w"><b id="n-wish">0</b><span>가고 싶은 나라</span></div>
    </div>
  </header>

  <div class="grid">
    <div class="chart">
      <div id="map"></div>
      <div class="zoom" id="zoom" hidden>
        <button type="button" id="z-in" aria-label="확대">+</button>
        <button type="button" id="z-out" aria-label="축소">−</button>
        <button type="button" id="z-reset" aria-label="처음 크기로">⟲</button>
      </div>
      <div class="legend"><span><i style="background:var(--stamp)"></i>진한 색 · 다녀옴</span><span><i style="background:var(--stamp);opacity:.42"></i>옅은 색 · 가고 싶음</span><span>확대하면 다녀온 도시 표시</span></div>
      <div id="tip" hidden></div>
      <div id="pop" class="pop" hidden></div>
    </div>

    <div class="side">
      <section class="entry">
        <div class="picker">
          <label for="pick">나라 선택</label>
          <select id="pick"><option value="">지도에서 누르거나 여기서 고르세요</option></select>
        </div>
        <div id="panel"></div>
        <p class="status" id="status">기록을 불러오는 중…</p>
      </section>
    </div>
  </div>

  <section class="log">
    <div class="loghead"><h3>기록한 나라</h3><span class="lab" id="tsum"></span></div>
    <div class="tw" id="tw" hidden>
      <table>
        <thead><tr id="thead"></tr></thead>
        <tbody id="list"></tbody>
      </table>
    </div>
    <p class="hint" id="empty">아직 기록이 없습니다. 지도에서 다녀온 나라를 눌러 첫 기록을 남겨 보세요.</p>
  </section>
</div>

<div id="lb" hidden><img id="lb-img" alt="크게 본 사진"></div>
